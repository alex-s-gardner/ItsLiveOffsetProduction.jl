name = "ItsLiveOffsetProduction"
uuid = "74356795-1a89-4ad9-90d1-877978e2d409"
version = "0.1.0-DEV"
authors = ["Alex S. Gardner, JPL/NASA"]

[deps]
ArchGDAL = "c9ce4bd3-c3d5-55b8-8973-c0e20141b8c3"
AutoRIFT = "52cb0ed0-aa80-430c-bd04-c52888a79add"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
DimensionalData = "0703355e-b756-11e9-17c0-8b28908087d0"
FastGeoProjections = "981663e8-0c94-46dd-b2cf-efc8480900ec"
GeoFormatTypes = "68eda718-8dee-11e9-39e7-89f7f65f511f"
ImagePairGeometry = "7d3defa8-4bb6-45cf-b5d0-7628f127c0fd"
NCDatasets = "85f8d34a-cbdd-5861-8df4-14fed0d494ab"
Rasters = "a3a2b9e3-a471-40c9-b274-f788e487c689"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"

# Bounds match AutoRIFT.jl's, since the two resolve together in every deployment.
[compat]
ArchGDAL = "0.10"
AutoRIFT = "0.1"
Dates = "1"
DimensionalData = "0.29, 0.30"
FastGeoProjections = "0.1, 0.2"
GeoFormatTypes = "0.4"
ImagePairGeometry = "0.1"
NCDatasets = "0.13, 0.14"
Rasters = "0.14, 0.15"
Statistics = "1"
# 1.11, not the LTS: `AutoRIFT` and `ImagePairGeometry` are required dependencies and neither is
# registered, so they can only be resolved through `[sources]` -- which Pkg gained in 1.11 and
# ignores before it, leaving 1.10 to demand them from a registry that does not carry them.
julia = "1.11"

# None of these are registered, so the resolver needs an explicit source for each. `FastGeoProjections`
# is declared even though no code here uses it: `ImagePairGeometry` requires a version newer than the
# registered one, and Pkg resolves a `[sources]` entry only for a package that is also in `[deps]`.
[sources]
AutoRIFT = {rev = "main", url = "https://github.com/alex-s-gardner/AutoRIFT.jl"}
FastGeoProjections = {rev = "main", url = "https://github.com/alex-s-gardner/FastGeoProjections.jl"}
ImagePairGeometry = {rev = "main", url = "https://github.com/alex-s-gardner/ImagePairGeometry.jl"}

[extras]
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Random", "StaticArrays", "Test"]
