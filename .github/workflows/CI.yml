name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on a branch, never on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suite itself is seconds: it covers the netCDF schemas and the metadata arithmetic, not the
    # granule-to-product pipeline, which needs AWS credentials and stays a manually-run script under
    # tools/golden. The budget is for installing the GDAL and netCDF binaries that Rasters and
    # NCDatasets pull in, which is the slowest and least predictable part of this job.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Named channels rather than version numbers, so there is nothing to bump when a new
        # Julia lands. No `lts`: this package's required dependencies are unregistered and reachable
        # only through `[sources]`, which Pkg gained in 1.11, so 1.10 cannot install it at all.
        version: ['1', 'pre']
        os: [ubuntu-latest, macOS-latest, windows-latest]
        exclude:
          # One OS is enough to catch a breaking change on an unreleased Julia; three would
          # triple the cost of the job most likely to be red for reasons outside this package.
          - version: 'pre'
            os: macOS-latest
          - version: 'pre'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  app:
    name: app - Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    # The executable's own suite: the geometry rules a run applies before it reads a scene, which need no
    # network or credentials. The app pins its dependencies to unregistered branches through `[sources]`.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: julia --project=app -e 'import Pkg; Pkg.instantiate(); Pkg.test()'

  trim:
    name: app trimmed build - ubuntu-latest
    runs-on: ubuntu-latest
    # `juliac --trim=safe` rejects code the JIT accepts — a dynamic call, an abstract field, a boxed
    # capture — so the executable is built on every change to the app, not only on a release. Linux
    # x86-64 only: the release workflow builds every platform.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # The version `app/Manifest.toml` was resolved with.
          version: '1.13.0'
      - uses: julia-actions/cache@v2
        with:
          cache-name: trim-linux-x86_64
      - name: Install binutils
        # `app/link_libraries.sh` reads each library's SONAME with readelf.
        run: command -v readelf || (sudo apt-get update -q && sudo apt-get install -y -q binutils)
      - name: Install JuliaC
        run: julia -e 'import Pkg; Pkg.activate("jcdrv"; shared = true); Pkg.add(name = "JuliaC", version = "0.3.9")'
      - name: Build
        env:
          TRIM_JULIA: julia
        # pipefail: the build's own status, not tee's.
        shell: bash -eo pipefail {0}
        run: |
          app/build.sh "$RUNNER_TEMP/bundle" 2>&1 | tee "$RUNNER_TEMP/build.log"
          # `juliac` reports verifier errors and still writes an executable for some of them.
          if grep -q 'Verifier error' "$RUNNER_TEMP/build.log"; then
            grep -A12 'Verifier error #1:' "$RUNNER_TEMP/build.log" | head -40
            echo "::error::the trimmed build has verifier errors"; exit 1
          fi
          "$RUNNER_TEMP/bundle/bin/autorift_itslive" --help > /dev/null
