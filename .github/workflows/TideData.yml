name: Tide data

# The tide correction's published inputs, read where production reads them: the tide models and the
# BedMachine mask in s3://its-live-data/tidal/ and ERA5 in Google's ARCO-ERA5 store, checked against
# values computed independently (`app/test/tidenetwork.jl`), and ERA5's lag behind real time. Every three
# hours, as production runs continuously, and on demand; on a pull request only when the check itself or the
# code it exercises changes, so an outage of either store does not block other merges.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/TideData.yml
      - app/test/tidenetwork.jl
      - app/src/tidecorrection.jl
      - app/src/tides.jl

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tide-data:
    name: tide data - Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: julia --project=app -e 'import Pkg; Pkg.instantiate(); Pkg.test(; test_args = ["tidenetwork"])'
